server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      routes:
        - id: order-service
          uri: ${ORDER_SERVICE_URI:http://localhost:8081}
          predicates:
            - Path=/api/orders/**
          filters:
            - StripPrefix=2
        - id: inventory-service
          uri: ${INVENTORY_SERVICE_URI:http://localhost:8082}
          predicates:
            - Path=/api/inventory/**
          filters:
            - StripPrefix=2
      default-filters:
        - name: RequestRateLimiter
          args:
            redis-rate-limiter.replenishRate: ${GATEWAY_RATE_LIMIT_REPLENISH:20}
            redis-rate-limiter.burstCapacity: ${GATEWAY_RATE_LIMIT_BURST:40}
            redis-rate-limiter.requestedTokens: 1
            key-resolver: "#{@userKeyResolver}"
      discovery:
        enabled: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
    issuer: ${JWT_ISSUER:order-platform}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  demo-users:
    customer-password: ${CUSTOMER_PASSWORD:customer123}
    admin-password: ${ADMIN_PASSWORD:admin123}
  correlation:
    header: ${APP_CORRELATION_HEADER:X-Correlation-Id}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,gateway
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: api-gateway
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.example.orderplatform: INFO
