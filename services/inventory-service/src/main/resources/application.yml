spring:
  application:
    name: inventory-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/stock}
    username: ${SPRING_DATASOURCE_USERNAME:stockuser}
    password: ${SPRING_DATASOURCE_PASSWORD:stockpass}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: inventory-service
      auto-offset-reset: earliest
      enable-auto-commit: false
      properties:
        spring.json.trusted.packages: com.example.orderplatform
    producer:
      acks: all
      properties:
        enable.idempotence: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      timeout: 2s

app:
  jwt:
    secret: ${JWT_SECRET:dev-only-secret-change-me-please-32-bytes-minimum}
    issuer: ${JWT_ISSUER:order-platform}
  correlation:
    header: ${APP_CORRELATION_HEADER:X-Correlation-Id}
  outbox:
    poll-ms: ${OUTBOX_POLL_MS:500}
    batch-size: ${OUTBOX_BATCH_SIZE:50}
  cache:
    ttl-seconds: ${CACHE_TTL_SECONDS:300}

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /v3/api-docs

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics,caches
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: inventory-service
    distribution:
      percentiles-histogram:
        http.server.requests: true
  prometheus:
    metrics:
      export:
        enabled: true

logging:
  level:
    com.example.orderplatform: INFO
