# Grafana dashboard provisioning provider.
# Mount this file at /etc/grafana/provisioning/dashboards/dashboards.yml
# and dashboard.json at /var/lib/grafana/dashboards/dashboard.json.

apiVersion: 1

providers:
  - name: order-platform
    orgId: 1
    folder: Order Platform
    folderUid: order-platform
    type: file
    disableDeletion: false
    updateIntervalSeconds: 30
    allowUiUpdates: false
    options:
      path: /var/lib/grafana/dashboards
      foldersFromFilesStructure: false
