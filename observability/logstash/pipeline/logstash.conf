# Logstash pipeline for Order Management structured JSON logs.
#
# Services use logstash-logback-encoder and write one JSON object per line,
# including MDC fields such as correlationId. Filebeat ships those lines to
# the beats input; the http input is available for direct HTTP posting.
#
# Mount at /usr/share/logstash/pipeline/logstash.conf in the Logstash container.

input {
  beats {
    # Primary ingest port used by Filebeat (canonical Logstash port 5044).
    port => "${LOGSTASH_BEATS_PORT:5044}"
  }

  http {
    # Secondary port for direct JSON POSTs from services/scripts.
    port => "${LOGSTASH_HTTP_PORT:5045}"
    content_type => "application/json"
  }
}

filter {
  # Filebeat wraps the application's JSON log line in [message].
  if [message] =~ /^\s*\{/ {
    json {
      source => "message"
      skip_on_invalid_json => true
    }

    # logstash-logback-encoder emits @timestamp as an ISO-8601 string.
    date {
      match => ["@timestamp", "ISO8601"]
      target => "@timestamp"
      tag_on_failure => []
    }
  }

  # logstash-logback-encoder puts MDC entries under [mdc]. Copy the gateway's
  # correlation id to a top-level field so Kibana queries are simple.
  if ![correlationId] and [mdc][correlationId] {
    mutate {
      copy_field => { "[mdc][correlationId]" => "correlationId" }
    }
  }

  # Tolerate the other spellings used by HTTP headers and Kafka interceptors.
  if ![correlationId] and [mdc][correlation_id] {
    mutate {
      copy_field => { "[mdc][correlation_id]" => "correlationId" }
    }
  }
  if ![correlationId] and [headers][X-Correlation-Id] {
    mutate {
      copy_field => { "[headers][X-Correlation-Id]" => "correlationId" }
    }
  }
  if ![correlationId] and [x-correlation-id] {
    mutate {
      copy_field => { "[x-correlation-id]" => "correlationId" }
    }
  }

  # Some shippers nest the whole application event under [app].
  if ![correlationId] and [app][mdc][correlationId] {
    mutate {
      copy_field => { "[app][mdc][correlationId]" => "correlationId" }
    }
  }
  if ![correlationId] and [app][correlationId] {
    mutate {
      copy_field => { "[app][correlationId]" => "correlationId" }
    }
  }

  # Keep correlationId searchable as a single keyword (see index-template.json).
  if [correlationId] {
    mutate {
      convert => { "correlationId" => "string" }
    }
  }

  mutate {
    remove_field => ["@version"]
  }
}

output {
  elasticsearch {
    hosts => ["${ELASTICSEARCH_HOST:elasticsearch:9200}"]
    index => "orderplatform-logs-%{+YYYY.MM.dd}"
    # The index template in observability/elasticsearch controls mappings.
    manage_template => false
    ilm_enabled => false
  }

  # Uncomment for local pipeline debugging:
  # stdout { codec => rubydebug { metadata => true } }
}
