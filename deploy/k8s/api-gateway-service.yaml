apiVersion: v1
kind: Service
metadata:
  name: api-gateway
  namespace: order-platform
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: order-platform
spec:
  type: ClusterIP
  selector:
    app: api-gateway
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
