apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: order-platform-ingress
  namespace: order-platform
  labels:
    app: api-gateway
    app.kubernetes.io/part-of: order-platform
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
    nginx.ingress.kubernetes.io/proxy-body-size: 1m
spec:
  ingressClassName: nginx
  # Uncomment to terminate TLS with a pre-created Secret:
  # tls:
  #   - hosts:
  #       - orderplatform.local
  #     secretName: orderplatform-tls
  rules:
    - host: orderplatform.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api-gateway
                port:
                  name: http
