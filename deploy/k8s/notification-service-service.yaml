apiVersion: v1
kind: Service
metadata:
  name: notification-service
  namespace: order-platform
  labels:
    app: notification-service
    app.kubernetes.io/part-of: order-platform
spec:
  type: ClusterIP
  selector:
    app: notification-service
  ports:
    - name: http
      port: 8083
      targetPort: http
      protocol: TCP
