apiVersion: v1
kind: Service
metadata:
  name: order-service
  namespace: order-platform
  labels:
    app: order-service
    app.kubernetes.io/part-of: order-platform
spec:
  type: ClusterIP
  selector:
    app: order-service
  ports:
    - name: http
      port: 8081
      targetPort: http
      protocol: TCP
